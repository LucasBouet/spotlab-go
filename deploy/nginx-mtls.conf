# Full HTTPS + mTLS configuration for the public deployment (docs/MTLS.md).
#
# The client-certificate check happens entirely here, before nginx even
# opens an HTTP connection to the Go server: `ssl_verify_client on` fails
# the TLS handshake itself for any client that doesn't present a certificate
# signed by mtls-ca.crt. The Go server only ever sees plain HTTP from
# 127.0.0.1 and has no idea this check exists — that separation is the
# point (see docs/PLAN.md, "Je n'ai pas confiance en mon code").
#
# Server certificate: Let's Encrypt via `certbot certonly --manual
# --preferred-challenges dns -d spotlab.ugnbt.com` (DNS-01 — no inbound
# port 80 required to obtain it). Manual mode means no cron auto-renewal;
# repeat that command before 2026-11-11 and reload nginx.
#
# Client CA: cmd/mtls-ca (deployed on this server, see docs/MTLS.md §"Où vit
# la CA"). mtls-ca.crt lives at /etc/nginx/mtls-ca.crt; mtls-ca.crl is the
# revocation list, rewritten by `mtls-ca -revoke` and copied here from
# /root/mtls-ca/mtls-ca.crl — reload nginx after every revocation.

server {
    listen 80;
    listen [::]:80;
    server_name spotlab.ugnbt.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spotlab.ugnbt.com;

    ssl_certificate     /etc/letsencrypt/live/spotlab.ugnbt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spotlab.ugnbt.com/privkey.pem;

    # The whole point of this deployment: no client certificate, no
    # connection. `optional`/`on` both still run the app-level auth normally
    # once past this gate — this is a network boundary, not a replacement
    # for the bearer-token layer.
    ssl_client_certificate /etc/nginx/mtls-ca.crt;
    ssl_crl /etc/nginx/mtls-ca.crl;
    ssl_verify_client on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Required: SSE (GET /api/sync/stream) must not be buffered or timed out.
        proxy_buffering off;
        proxy_read_timeout 24h;
    }
}
