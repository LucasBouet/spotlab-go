# Two requirements carried over from the Next.js deployment (see
# spotlab_/README.md) — SSE has the same needs regardless of backend
# language. WebAuthn's forwarded-header requirement doesn't apply here
# (passkeys are out of v1 scope), but Host/X-Forwarded-* are still forwarded
# for correct logging.
#
# During Phase 0-8 development, point curl/Android directly at
# http://<vm-ip>:8081 instead — this snippet is only for the real cutover
# (docs/PLAN.md §6), by flipping proxy_pass from :3000 to :8081.
location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required: SSE must not be buffered or timed out.
    proxy_buffering off;
    proxy_read_timeout 24h;
}
